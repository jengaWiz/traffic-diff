[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadowdiff"
version = "0.1.0"
description = "Record real API traffic, replay it against a new version, and flag only the response changes that matter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ayaan Ali" }]
keywords = ["api", "regression", "testing", "traffic-replay", "diff", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2", "twine>=5"]

[project.scripts]
shadowdiff = "shadowdiff.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["shadowdiff"]

[tool.hatch.build.targets.sdist]
include = ["shadowdiff", "tests", "README.md", "LICENSE", "shadowdiff.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
