# Demo stack: shop API v1 (:8001), buggy v2 (:8002), and the recorder (:8080 -> v1).
services:
  v1:
    build: .
    command: ["uvicorn", "demo.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      VERSION: v1
    ports: ["8001:8001"]

  v2:
    build: .
    command: ["uvicorn", "demo.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      VERSION: v2
    ports: ["8002:8002"]

  recorder:
    build: .
    command:
      - shadowdiff
      - record
      - --target=http://v1:8001
      - --host=0.0.0.0
      - --port=8080
      - --session=demo
      - --db=/data/shadowdiff.db
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
    depends_on: [v1]
